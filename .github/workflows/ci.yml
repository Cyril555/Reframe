name: CI

on:
  push:
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify every recorded agent call
        run: npm run verify
      - name: Typecheck
        run: npm run typecheck
      - name: Build static site
        run: npm run build
